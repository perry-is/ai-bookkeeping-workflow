[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-bookkeeping-workflow"
version = "0.1.0"
description = "Clean-room portfolio prototype for an auditable bookkeeping workflow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bookkeeping-demo = "bookkeeping_workflow.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
